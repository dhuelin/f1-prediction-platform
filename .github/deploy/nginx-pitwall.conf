# nginx config for pitwall.guru — managed by deploy.yml, do not edit on server
# Serves the Pitwall launch page (Astro static) and proxies API paths to api-gateway

server {
    listen 80;
    server_name pitwall.guru www.pitwall.guru;

    root /opt/f1predict/web-static;
    index index.html;

    # Proxy all backend API paths to api-gateway.
    #
    # The (/|$) matters: with a bare trailing slash this pattern does not match a
    # collection root, so /leagues, /predictions and /auth would fall through to
    # the static location below and return the launch page instead of the API.
    # The running server already routes those to the gateway -- verified live,
    # /auth returns a JSON 404 from the application and /leagues returns 401 --
    # so this file was behind what production actually does, and re-applying it
    # as it stood would have broken every collection root.
    location ~ ^/(auth|f1|predictions|leagues|scores|notifications|analytics|ws)(/|$) {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    # Serve static launch page — SPA fallback for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
