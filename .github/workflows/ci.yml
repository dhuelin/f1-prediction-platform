name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-and-test:
    name: Build & Unit Tests
    runs-on: ubuntu-latest
    container: gradle:8.7-jdk21
    steps:
      - uses: actions/checkout@v4

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            /root/.gradle/caches
            /root/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: gradle-

      - name: Run all unit tests
        run: ./gradlew test --no-daemon -q
        env:
          APNS_TEAM_ID: test
          APNS_KEY_ID: test
          APNS_BUNDLE_ID: com.f1predict.app

  docker-smoke-test:
    name: Docker Compose Smoke Test
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Pre-pull infrastructure images (with retry)
        run: |
          pull_with_retry() {
            local image=$1
            for i in 1 2 3; do
              docker pull "$image" && return 0
              echo "  Pull failed for $image (attempt $i/3), retrying in 15s..."
              sleep 15
            done
            echo "  Could not pull $image after 3 attempts"
            return 1
          }
          pull_with_retry postgres:16-alpine  || exit 1
          pull_with_retry redis:7-alpine      || exit 1
          pull_with_retry rabbitmq:3-management-alpine || exit 1

      - name: Build and start all services
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
        timeout-minutes: 15

      - name: Wait for all services to pass health checks
        run: |
          # wait_healthy <name> <port> [<context-path>]
          # context-path defaults to empty (most services); f1-data-service uses /f1
          wait_healthy() {
            local name=$1
            local port=$2
            local ctx=${3:-}
            echo "Waiting for $name (${ctx}/actuator/health on $port)..."
            for i in $(seq 1 60); do
              local status
              status=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 3 \
                "http://localhost:${port}${ctx}/actuator/health" 2>/dev/null || echo "000")
              if [ "$status" = "200" ]; then
                echo "  $name is healthy"
                return 0
              fi
              echo "  Attempt $i/60 (HTTP $status) - waiting 5s..."
              sleep 5
            done
            echo "  $name did not become healthy after 5 minutes"
            docker compose -f docker-compose.yml -f docker-compose.dev.yml logs "$name" --tail=30
            return 1
          }

          wait_healthy pitwall-api     8081     || exit 1
          wait_healthy f1-data-service 8085 /f1 || exit 1
          wait_healthy api-gateway     8080     || exit 1

      - name: Smoke test - all routes reachable via api-gateway
        run: |
          check_route() {
            local label=$1
            local url=$2
            local status
            status=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 5 "$url")
            echo "Gateway $label: HTTP $status"
            # 502/503/504 = gateway cannot reach the backend service
            if echo "$status" | grep -qE "^50[234]$"; then
              echo "  FAIL: gateway returned $status — backend unreachable or route misconfigured"
              docker compose logs api-gateway --tail=20
              return 1
            fi
            return 0
          }

          check_route "/auth"          "http://localhost:8080/auth/api/v1/login"     || exit 1
          check_route "/predictions"   "http://localhost:8080/predictions/"          || exit 1
          check_route "/leagues"       "http://localhost:8080/leagues/"              || exit 1
          check_route "/scores"        "http://localhost:8080/scores/"               || exit 1
          check_route "/f1"            "http://localhost:8080/f1/races"              || exit 1
          check_route "/notifications" "http://localhost:8080/notifications/health"  || exit 1
          check_route "/analytics"     "http://localhost:8080/analytics/participation" || exit 1

      - name: Print all service logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml logs --tail=50

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml down -v

  web-typecheck:
    name: Web TypeScript Check
    runs-on: ubuntu-latest
    container: node:20
    steps:
      - uses: actions/checkout@v4

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: web/node_modules
          key: npm-web-${{ hashFiles('web/package-lock.json') }}
          restore-keys: npm-web-

      - name: Install dependencies
        working-directory: web
        run: npm ci

      # `tsc -b`, not `tsc --noEmit`: web/tsconfig.json is a project-references
      # stub with "files": [], so a plain `tsc --noEmit` there typechecks nothing
      # and passes on a codebase full of errors. Build mode follows the
      # references into tsconfig.app.json where the sources actually are.
      - name: TypeScript check
        working-directory: web
        run: npx tsc -b --noEmit

      - name: Production build
        working-directory: web
        run: npm run build

  mobile-typecheck:
    name: Mobile TypeScript Check
    runs-on: ubuntu-latest
    container: node:20
    steps:
      - uses: actions/checkout@v4

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: mobile/node_modules
          key: npm-${{ hashFiles('mobile/package-lock.json') }}
          restore-keys: npm-

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: TypeScript check
        working-directory: mobile
        run: npx tsc --noEmit

  # ── Deploy-template smoke test ────────────────────────────────────────────
  # The docker-smoke-test job above runs docker-compose.yml with
  # docker-compose.dev.yml, so the production and test templates are never
  # started by any check. A RABBITMQ_VM_MEMORY_HIGH_WATERMARK line sat in the
  # prod template through several green CI runs and then took production down:
  # the image's entrypoint keeps that variable on a deprecated list and exits 1
  # before RabbitMQ starts, so the container died in about a second and the
  # three application services, which depend on it being healthy, never came up.
  #
  # Starting the infrastructure services from the real templates with the real
  # images catches that class of fault -- anything that makes a container refuse
  # to start under its production configuration. The application services are
  # skipped: their images live in GHCR and are built by the deploy, not here.
  deploy-template-smoke:
    name: Deploy Template Smoke Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        template: [prod, test]
    steps:
      - uses: actions/checkout@v4

      - name: Render ${{ matrix.template }} template
        run: |
          # The image tags only matter for the application services, which are
          # not started here, so any placeholder will do.
          sed \
            -e "s|IMAGE_PREFIX|ghcr.io/placeholder|g" \
            -e "s|IMAGE_TAG|placeholder|g" \
            .github/deploy/docker-compose.${{ matrix.template }}.yml.tpl \
            > docker-compose.rendered.yml

      - name: Validate merged configuration
        run: |
          docker compose -f docker-compose.yml -f docker-compose.rendered.yml config >/dev/null
          echo "  merged configuration is valid"

      - name: Start infrastructure from the ${{ matrix.template }} template
        run: |
          docker compose -f docker-compose.yml -f docker-compose.rendered.yml \
            up -d postgres redis rabbitmq

      - name: Every infrastructure container must become healthy
        run: |
          # A container that exits on a bad configuration shows up here as
          # "exited" rather than "healthy", which is exactly what the prod
          # template did to rabbitmq.
          for name in postgres redis rabbitmq; do
            cid=$(docker compose -f docker-compose.yml -f docker-compose.rendered.yml ps -q "$name")
            if [ -z "$cid" ]; then
              echo "FAIL: $name has no container"
              exit 1
            fi
            for attempt in $(seq 1 30); do
              state=$(docker inspect -f '{{.State.Status}}' "$cid")
              health=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$cid")
              echo "  $name: $state/$health (attempt $attempt/30)"
              case "$state/$health" in
                running/healthy|running/none) echo "  $name: ok"; break ;;
                exited/*|dead/*)
                  echo "FAIL: $name exited under the ${{ matrix.template }} template"
                  docker logs "$cid" 2>&1 | tail -30
                  exit 1 ;;
              esac
              # restarting counts as not-yet-healthy, but a container that keeps
              # restarting never reaches healthy and fails on the last attempt
              [ "$attempt" -lt 30 ] && sleep 5 || {
                echo "FAIL: $name never became healthy"
                docker logs "$cid" 2>&1 | tail -30
                exit 1; }
            done
          done
          echo "all infrastructure containers healthy under the ${{ matrix.template }} template"

      - name: Tear down
        if: always()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.rendered.yml \
            down -v --remove-orphans || true
