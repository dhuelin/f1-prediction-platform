name: Deploy Web App

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build (production)
        working-directory: web
        env:
          # The API lives under the apex, not api.pitwall.guru.
          #
          # .github/deploy/nginx-pitwall.conf has one server block — listen 80,
          # server_name "pitwall.guru www.pitwall.guru" — and it proxies
          # /auth|/f1|/predictions|/leagues|/scores|/notifications|/analytics|/ws
          # to the api-gateway, serving the launch page for everything else.
          # Verified live: https://pitwall.guru/f1/calendar/current returns 401
          # from the gateway, so the apex does reach the API.
          #
          # api.pitwall.guru is a DNS-only record straight to the VPS, and nginx
          # has no 443 listener or certificate, so a direct HTTPS request to it is
          # reset during the TLS handshake. It answers on plain HTTP only. Pointing
          # the app at https://api.pitwall.guru therefore breaks every API call.
          VITE_API_BASE_URL: https://pitwall.guru
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web/dist --project-name=pitwall-app --branch=main
