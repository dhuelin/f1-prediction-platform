name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      services:
        description: "Comma-separated list of services to deploy (leave empty for all)"
        required: false
        default: ""

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/f1-predict

jobs:
  # ── 1. Build & push all Docker images ─────────────────────────────────────
  build-images:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - name: api-gateway
            context: .
            dockerfile: api-gateway/Dockerfile
            port: 8080
          # auth, league, prediction, scoring, notification and analytics
          - name: pitwall-api
            context: .
            dockerfile: pitwall-api/Dockerfile
            port: 8081
          - name: f1-data-service
            context: .
            dockerfile: services/f1-data-service/Dockerfile
            port: 8085
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.service.name }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push ${{ matrix.service.name }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}

  # ── 2. Deploy to production via SSH ───────────────────────────────────────
  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    needs: build-images
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          known_hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

      # A deploy step can legitimately sit silent for minutes -- a Spring Boot
      # start, a large dump, an image pull on a small VPS. Without keepalives the
      # client gives up on a quiet connection and the step dies with
      # "client_loop: send disconnect: Broken pipe" and exit 255, which looks
      # like a script failure but is the SSH session dropping.
      - name: Configure SSH keepalives
        run: |
          cat >> ~/.ssh/config <<'EOF'
          Host *
            ServerAliveInterval 30
            ServerAliveCountMax 20
            ConnectTimeout 30
            TCPKeepAlive yes
          EOF
          chmod 600 ~/.ssh/config

      - name: Prepare docker-compose.prod.yml
        env:
          SHA: ${{ github.sha }}
          IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}
        run: |
          # Substitute image tags in the production compose override
          sed \
            -e "s|IMAGE_PREFIX|${IMAGE_PREFIX}|g" \
            -e "s|IMAGE_TAG|sha-${SHA::7}|g" \
            .github/deploy/docker-compose.prod.yml.tpl > docker-compose.prod.yml

      - name: Copy compose files to server
        run: |
          scp docker-compose.yml docker-compose.prod.yml \
            infra/backup-db.sh infra/consolidate-databases.sh \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/f1predict/

      - name: Bootstrap server .env (generate secrets if missing)
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh ${DEPLOY_USER}@${DEPLOY_HOST} '
            touch /opt/f1predict/.env
            cd /opt/f1predict
            # Generate JWT_SECRET if not already set to a non-empty value
            if ! grep -q "^JWT_SECRET=.\+" .env 2>/dev/null; then
              JWT_SECRET=$(openssl rand -base64 48)
              if grep -q "^JWT_SECRET=" .env 2>/dev/null; then
                sed -i "s|^JWT_SECRET=.*|JWT_SECRET=${JWT_SECRET}|" .env
              else
                echo "JWT_SECRET=${JWT_SECRET}" >> .env
              fi
              echo "  JWT_SECRET: generated"
            else
              echo "  JWT_SECRET: already set"
            fi
          '

      - name: Pre-deploy backup of every database
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          # Runs before any image is pulled or any container replaced, so there is
          # always a dump taken immediately before the change. Every database on
          # the box is dumped, not just the two this release uses: the
          # per-service databases from before the consolidation still hold the
          # live data, and they are exactly what the next step reads.
          #
          # A failure here fails the deploy. Deploying on top of data with no
          # backup is the one thing worth stopping for.
          ssh ${DEPLOY_USER}@${DEPLOY_HOST} '
            set -euo pipefail
            cd /opt/f1predict
            chmod +x backup-db.sh consolidate-databases.sh

            # Postgres has to be up to dump it, but it must NOT be recreated
            # here. This compose file adds a mem_limit to postgres, so a plain
            # `up -d postgres` sees a changed config and replaces the container
            # -- taking the database down while the superseded per-service
            # containers are still running and reconnecting hard. On a VPS that
            # is already memory-tight that is enough to wedge the whole box:
            # every SSH session stalls, outbound network stops, and the deploy
            # dies with a broken pipe. It happened, on run 26.
            #
            # So: use the running container as it is, and only start one if
            # there is none. --no-recreate leaves an existing container alone
            # even when the config has changed; postgres picks up its mem_limit
            # later, in the step that replaces the application containers, by
            # which point the old JVMs are gone and the memory is free.
            if [ -n "$(docker ps -q -f name=^f1predict-postgres-1$)" ]; then
              echo "  postgres: already running, left untouched"
            else
              echo "  postgres: not running, starting without recreating"
              docker compose -f docker-compose.yml -f docker-compose.prod.yml \
                up -d --no-recreate postgres
            fi
            for i in $(seq 1 24); do
              docker exec f1predict-postgres-1 pg_isready -U f1predict >/dev/null 2>&1 && break
              echo "  waiting for postgres... ($i/24)"
              sleep 5
            done
            docker exec f1predict-postgres-1 pg_isready -U f1predict

            ALL=$(docker exec f1predict-postgres-1 psql -U f1predict -d postgres -tAc \
              "SELECT datname FROM pg_database WHERE NOT datistemplate AND datname <> '"'"'postgres'"'"' ORDER BY 1" \
              | tr -d "\r" | tr "\n" " ")
            echo "  databases on the box: ${ALL:-none}"

            # n_live_tup is the statistics collector'"'"'s estimate, not an exact
            # count -- good enough for a log of what was on the box, and far
            # cheaper than count(*) over every table. The consolidation step
            # counts rows exactly before it copies anything.
            echo "  non-empty tables before the deploy (estimated row counts):"
            for db in $ALL; do
              docker exec f1predict-postgres-1 psql -U f1predict -d "$db" -tAc "
                SELECT '"'"'    '"'"' || current_database() || '"'"'.'"'"' || relname
                       || '"'"' ~ '"'"' || n_live_tup
                FROM pg_stat_user_tables WHERE n_live_tup > 0 ORDER BY relname" || true
            done

            if [ -n "${ALL// /}" ]; then
              DATABASES="$ALL" STACK_DIR=/opt/f1predict ./backup-db.sh
              echo "  backups on disk:"
              ls -lh /opt/f1predict/backups/*.sql.gz | tail -20
            else
              echo "  no databases yet -- nothing to back up"
            fi
          '

      - name: Sync launch page static files
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh ${DEPLOY_USER}@${DEPLOY_HOST} '
            set -e
            # Sync BEFORE docker compose up so the web-static volume has content on first boot
            if [ -d /opt/f1predict/web-static/.git ]; then
              git -C /opt/f1predict/web-static fetch --quiet origin gh-pages
              git -C /opt/f1predict/web-static reset --hard origin/gh-pages
            else
              git clone --quiet --single-branch --branch gh-pages \
                https://github.com/dhuelin/pitwall-launch.git \
                /opt/f1predict/web-static
            fi
            echo "  launch page: synced ($(ls /opt/f1predict/web-static | wc -l) files)"
          '

      - name: Retire the superseded per-service containers
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          # This release replaces six JVMs with one, and the box does not have
          # room to run both sets at once. Stopping the old containers before
          # pulling means the new ones start on a box with memory free, rather
          # than competing with services they have already replaced.
          #
          # auth-service, league-service, prediction-service, scoring-service,
          # notification-service and analytics-service are not in the new
          # compose files at all, so Compose treats them as orphans of this
          # project and --remove-orphans is enough to identify and remove them.
          # No hardcoded container list to drift out of date.
          #
          # Infrastructure is named explicitly with --no-recreate so postgres,
          # redis and rabbitmq keep running untouched: the backup above has
          # already been taken, but there is no reason to interrupt them.
          ssh ${DEPLOY_USER}@${DEPLOY_HOST} '
            set -euo pipefail
            cd /opt/f1predict
            echo "  running before:"
            docker ps --format "    {{.Names}}  {{.Status}}"
            docker compose -f docker-compose.yml -f docker-compose.prod.yml \
              up -d --no-recreate --remove-orphans postgres redis rabbitmq
            echo "  running after:"
            docker ps --format "    {{.Names}}  {{.Status}}"
            echo "  memory:"
            free -m | sed "s/^/    /"
          '

      # Before the application containers, not after: pitwall-api connects to
      # pitwall_db on startup, so a database that does not exist yet means a
      # crash-restart loop until this step catches up.
      - name: Initialise databases (idempotent)
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh ${DEPLOY_USER}@${DEPLOY_HOST} '
            # Postgres is already up and ready -- the backup step above waited
            # for it -- but check again so this step stands on its own.
            for i in $(seq 1 12); do
              docker exec f1predict-postgres-1 pg_isready -U f1predict 2>/dev/null && break
              echo "Waiting for postgres... ($i/12)"
              sleep 5
            done
            # Create each database if it does not already exist (safe on every deploy)
            for db in pitwall_db f1data_db; do
              docker exec f1predict-postgres-1 psql -U f1predict -d postgres -tc \
                "SELECT 1 FROM pg_database WHERE datname = '"'"'${db}'"'"'" \
                | grep -q 1 \
                || docker exec f1predict-postgres-1 psql -U f1predict -d postgres -c "CREATE DATABASE ${db};"
              echo "  ${db}: ready"
            done
          '

      - name: Pull new images and restart services
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh ${DEPLOY_USER}@${DEPLOY_HOST} '
            set -e
            cd /opt/f1predict
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull \
              api-gateway pitwall-api f1-data-service web-static
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans \
              api-gateway pitwall-api f1-data-service web-static
            docker image prune -f
          '

      - name: Consolidate the per-service databases into pitwall_db
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          # This release replaces six services, each with its own database, with
          # one pitwall-api reading pitwall_db. Without this step the old data
          # stays on disk unread and the app comes up looking like a fresh
          # install.
          #
          # The script is idempotent and read-only against the old databases, so
          # it is safe on every deploy: on a box that has already been
          # consolidated, or never held the old databases, it reports and exits 0.
          # See infra/consolidate-databases.sh for what it copies and why.
          ssh ${DEPLOY_USER}@${DEPLOY_HOST} '
            set -euo pipefail
            cd /opt/f1predict

            # Wait for pitwall-api to finish applying its migrations -- the
            # tables have to exist before anything is copied into them. Flyway
            # runs during startup, so this is also the real readiness check for
            # the new container.
            for i in $(seq 1 60); do
              APPLIED=$(docker exec f1predict-postgres-1 psql -U f1predict -d pitwall_db -tAc \
                "SELECT count(*) FROM flyway_schema_history WHERE success" 2>/dev/null || echo 0)
              [ "${APPLIED:-0}" -ge 12 ] && break
              echo "  waiting for pitwall-api migrations... (${APPLIED:-0}/12, attempt $i/60)"
              sleep 5
            done

            STACK_DIR=/opt/f1predict ./consolidate-databases.sh

            # Restart so no request is served mid-copy against a half-populated
            # database. Cheap -- one container, no image pull.
            docker compose -f docker-compose.yml -f docker-compose.prod.yml restart pitwall-api
          '

      - name: Install daily database backup cron
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh ${DEPLOY_USER}@${DEPLOY_HOST} '
            set -e
            chmod +x /opt/f1predict/backup-db.sh
            mkdir -p /opt/f1predict/backups
            ENTRY="15 3 * * * STACK_DIR=/opt/f1predict /opt/f1predict/backup-db.sh >> /opt/f1predict/backups/cron.log 2>&1"
            # Idempotent: replace any previous entry rather than stacking duplicates
            # on every deploy, and keep every unrelated job.
            #
            # Read the existing crontab into a variable BEFORE writing. Piping
            # `crontab -l` straight into `crontab -` has both ends of the pipeline
            # touching the same crontab at once, which can truncate it before it
            # has been read — silently dropping every other cron job on the box.
            CURRENT=$(crontab -l 2>/dev/null | grep -vF "backup-db.sh" || true)
            if [ -n "$CURRENT" ]; then
              printf "%s\n%s\n" "$CURRENT" "$ENTRY" | crontab -
            else
              printf "%s\n" "$ENTRY" | crontab -
            fi
            echo "  backup cron: installed for 03:15 UTC daily"
            crontab -l | grep -F "backup-db.sh"
          '

      - name: Post-deploy smoke test (functional)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          PROD_BASE_URL: ${{ vars.PROD_BASE_URL }}
          SMOKE_RUN_ID: ${{ github.run_id }}
        run: |
          # Helper: retry a plain HTTP check (for gateway/startup errors)
          # 30 attempts × 20s = 600s (10 min) — Spring Boot on VPS can take 4-5 min cold
          wait_for_service() {
            local label=$1 url=$2
            local status attempt
            for attempt in $(seq 1 30); do
              status=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 10 "$url")
              echo "  $label → HTTP $status (attempt $attempt/30)"
              # 502/503 = gateway up but upstream still starting — keep waiting
              if [ "$status" = "000" ] || echo "$status" | grep -qE "^50[234]$"; then
                [ "$attempt" -lt 30 ] && sleep 20 || return 1
              else
                return 0
              fi
            done
          }

          # Wait for api-gateway / Spring Boot first — covers both API and launch page
          echo "── 1. Wait for api-gateway (Spring Boot ~2-3 min) ─"
          wait_for_service "auth-gateway" "${PROD_BASE_URL}/auth/register" || exit 1

          echo "── 2. Launch page ───────────────────────────────"
          PAGE_STATUS=$(curl -s -o /tmp/page.html -w "%{http_code}" --connect-timeout 10 "https://pitwall.guru")
          echo "  pitwall.guru → HTTP $PAGE_STATUS"
          [ "$PAGE_STATUS" = "200" ] || { echo "FAIL: launch page not served (HTTP $PAGE_STATUS)"; exit 1; }
          grep -qi "pitwall" /tmp/page.html || { echo "FAIL: page HTML missing Pitwall content"; exit 1; }
          echo "  content: OK"

          echo "── 3. Auth service — functional register + token ──"
          SMOKE_EMAIL="smoke-${SMOKE_RUN_ID}@pitwall.guru"
          TOKEN=""
          for reg_attempt in $(seq 1 5); do
            REG=$(curl -s -X POST "${PROD_BASE_URL}/auth/register" \
              -H "Content-Type: application/json" \
              -d "{\"email\":\"${SMOKE_EMAIL}\",\"password\":\"SmokeTest1!\",\"username\":\"smoke${SMOKE_RUN_ID}\"}")
            TOKEN=$(echo "$REG" | grep -o '"accessToken":"[^"]*"' | sed 's/"accessToken":"//;s/"//')
            [ -n "$TOKEN" ] && break
            echo "  register attempt $reg_attempt failed (retrying in 15s): $(echo "$REG" | head -c 120)"
            [ "$reg_attempt" -lt 5 ] && sleep 15 || { echo "FAIL: could not obtain token after 5 attempts"; exit 1; }
          done
          echo "  register → token acquired (${#TOKEN} chars)"

          echo "── 4. F1 data service — authenticated call ───────"
          F1_STATUS=$(curl -s -o /tmp/f1.json -w "%{http_code}" --connect-timeout 10 \
            -H "Authorization: Bearer $TOKEN" "${PROD_BASE_URL}/f1/calendar/current")
          echo "  f1data → HTTP $F1_STATUS"
          echo "$F1_STATUS" | grep -qE "^(200|404)$" || { echo "FAIL: f1data returned $F1_STATUS"; exit 1; }

          echo "── 5. Analytics service — authenticated call ─────"
          AN_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 10 \
            -H "Authorization: Bearer $TOKEN" "${PROD_BASE_URL}/analytics/participation")
          echo "  analytics → HTTP $AN_STATUS"
          echo "$AN_STATUS" | grep -qE "^(200|404)$" || { echo "FAIL: analytics returned $AN_STATUS"; exit 1; }

          echo "All smoke tests passed ✓"

  # ── 3. Deploy to test environment (test.pitwall.guru) ────────────────────
  # Runs AFTER the production deploy, not alongside it. DEPLOY_HOST is the same
  # machine for both, so in parallel the two jobs pull images, replace
  # containers and run dumps on one small VPS at the same time. On run 26 that
  # left the box unresponsive for four minutes: both jobs lost their SSH
  # sessions to broken pipes and the site stopped answering. Serialising them
  # costs a few minutes and removes the contention.
  deploy-test:
    name: Deploy to Test Server
    runs-on: ubuntu-latest
    needs: [build-images, deploy]
    environment: test
    concurrency:
      group: test-deploy
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          known_hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

      - name: Prepare docker-compose.test.yml
        env:
          SHA: ${{ github.sha }}
          IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}
        run: |
          sed \
            -e "s|IMAGE_PREFIX|${IMAGE_PREFIX}|g" \
            -e "s|IMAGE_TAG|sha-${SHA::7}|g" \
            .github/deploy/docker-compose.test.yml.tpl > docker-compose.test.yml

      - name: Copy compose files to test server
        run: |
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} 'mkdir -p ~/f1predict-test'
          scp docker-compose.yml docker-compose.test.yml \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:~/f1predict-test/

      - name: Bootstrap test .env (generate secrets if missing)
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh ${DEPLOY_USER}@${DEPLOY_HOST} '
            touch ~/f1predict-test/.env
            cd ~/f1predict-test
            if ! grep -q "^JWT_SECRET=.\+" .env 2>/dev/null; then
              JWT_SECRET=$(openssl rand -base64 48)
              if grep -q "^JWT_SECRET=" .env 2>/dev/null; then
                sed -i "s|^JWT_SECRET=.*|JWT_SECRET=${JWT_SECRET}|" .env
              else
                echo "JWT_SECRET=${JWT_SECRET}" >> .env
              fi
              echo "  JWT_SECRET: generated"
            else
              echo "  JWT_SECRET: already set"
            fi
          '

      - name: Sync launch page static files (test)
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh ${DEPLOY_USER}@${DEPLOY_HOST} '
            set -e
            if [ -d ~/f1predict-test/web-static/.git ]; then
              git -C ~/f1predict-test/web-static fetch --quiet origin gh-pages
              git -C ~/f1predict-test/web-static reset --hard origin/gh-pages
            else
              git clone --quiet --single-branch --branch gh-pages \
                https://github.com/dhuelin/pitwall-launch.git \
                ~/f1predict-test/web-static
            fi
            echo "  launch page: synced ($(ls ~/f1predict-test/web-static | wc -l) files)"
          '

      - name: Pull new images and restart test services
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh ${DEPLOY_USER}@${DEPLOY_HOST} '
            set -e
            cd ~/f1predict-test
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose --project-name f1predict-test -f docker-compose.yml -f docker-compose.test.yml pull \
              api-gateway pitwall-api f1-data-service web-static
            docker compose --project-name f1predict-test -f docker-compose.yml -f docker-compose.test.yml up -d --remove-orphans \
              api-gateway pitwall-api f1-data-service web-static
            docker image prune -f
          '

      - name: Initialise test databases (idempotent)
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh ${DEPLOY_USER}@${DEPLOY_HOST} '
            for i in $(seq 1 12); do
              docker exec f1predict-test-postgres-1 pg_isready -U f1predict 2>/dev/null && break
              echo "Waiting for postgres... ($i/12)"
              sleep 5
            done
            for db in pitwall_db f1data_db; do
              docker exec f1predict-test-postgres-1 psql -U f1predict -d postgres -tc \
                "SELECT 1 FROM pg_database WHERE datname = '"'"'${db}'"'"'" \
                | grep -q 1 \
                || docker exec f1predict-test-postgres-1 psql -U f1predict -d postgres -c "CREATE DATABASE ${db};"
              echo "  ${db}: ready"
            done
          '

      - name: Check nginx config for test.pitwall.guru
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh ${DEPLOY_USER}@${DEPLOY_HOST} '
            if [ -f /etc/nginx/sites-enabled/nginx-test.conf ] || \
               nginx -T 2>/dev/null | grep -q "test.pitwall.guru"; then
              echo "  nginx: test.pitwall.guru configured ✓"
            else
              echo "::warning::nginx not yet configured for test.pitwall.guru."
              echo "  One-time setup required (run once as root on the VPS):"
              echo "    sudo cp ~/f1predict-test/../nginx-test.conf /etc/nginx/sites-enabled/nginx-test.conf"
              echo "    sudo nginx -t && sudo systemctl reload nginx"
              echo "  Config file: .github/deploy/nginx-test.conf in this repo"
              echo "  Until then, test API is available at http://$(hostname -I | awk '"'"'{print $1}'"'"'):8090"
            fi
          ' || true

      - name: Post-deploy smoke test (test env)
        env:
          TEST_BASE_URL: ${{ vars.TEST_BASE_URL }}
          SMOKE_RUN_ID: ${{ github.run_id }}
        run: |
          # Skip smoke test entirely if TEST_BASE_URL isn't configured yet
          if [ -z "${TEST_BASE_URL}" ]; then
            echo "TEST_BASE_URL not set — skipping test env smoke test (set vars.TEST_BASE_URL to enable)"
            exit 0
          fi

          wait_for_service() {
            local label=$1 url=$2
            local status attempt
            for attempt in $(seq 1 30); do
              status=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 10 "$url")
              echo "  $label → HTTP $status (attempt $attempt/30)"
              if [ "$status" = "000" ] || echo "$status" | grep -qE "^50[234]$"; then
                [ "$attempt" -lt 30 ] && sleep 20 || return 1
              else
                return 0
              fi
            done
          }

          echo "── 1. Wait for test api-gateway (Spring Boot ~2-3 min) ─"
          wait_for_service "test-gateway" "${TEST_BASE_URL}/auth/register" || exit 1

          echo "── 2. Auth service — functional register + token ──"
          SMOKE_EMAIL="smoke-test-${SMOKE_RUN_ID}@pitwall.guru"
          TOKEN=""
          for reg_attempt in $(seq 1 5); do
            REG=$(curl -s -X POST "${TEST_BASE_URL}/auth/register" \
              -H "Content-Type: application/json" \
              -d "{\"email\":\"${SMOKE_EMAIL}\",\"password\":\"SmokeTest1!\",\"username\":\"smoketest${SMOKE_RUN_ID}\"}")
            TOKEN=$(echo "$REG" | grep -o '"accessToken":"[^"]*"' | sed 's/"accessToken":"//;s/"//')
            [ -n "$TOKEN" ] && break
            echo "  register attempt $reg_attempt failed (retrying in 15s): $(echo "$REG" | head -c 120)"
            [ "$reg_attempt" -lt 5 ] && sleep 15 || { echo "FAIL: could not obtain token after 5 attempts"; exit 1; }
          done
          echo "  register → token acquired (${#TOKEN} chars)"

          echo "── 3. Leagues service — create league ──"
          LEAGUE=$(curl -s -X POST "${TEST_BASE_URL}/leagues" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $TOKEN" \
            -d '{"name":"Smoke Test League","public":true}')
          LEAGUE_ID=$(echo "$LEAGUE" | grep -o '"id":"[^"]*"' | head -1 | sed 's/"id":"//;s/"//')
          [ -n "$LEAGUE_ID" ] && echo "  leagues → created (id: ${LEAGUE_ID})" || \
            echo "  leagues → unexpected response: $(echo "$LEAGUE" | head -c 120)"

          echo "── 4. Analytics service — authenticated call ──"
          AN_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 10 \
            -H "Authorization: Bearer $TOKEN" "${TEST_BASE_URL}/analytics/participation")
          echo "  analytics → HTTP $AN_STATUS"
          echo "$AN_STATUS" | grep -qE "^(200|404)$" || { echo "FAIL: analytics returned $AN_STATUS"; exit 1; }

          echo "All test smoke tests passed ✓"

  # ── 4. Notify on failure ──────────────────────────────────────────────────
  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [build-images, deploy, deploy-test]
    if: failure()
    steps:
      - name: Post failure summary
        run: |
          echo "::error::Production deployment failed for commit ${{ github.sha }}"
          echo "Check the workflow run for details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
