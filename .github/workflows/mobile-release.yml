name: Mobile Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"  # e.g. v1.2.3

jobs:
  # ── iOS ───────────────────────────────────────────────────────────────────
  ios-build-submit:
    name: iOS — Build & Submit to App Store
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Build & Submit iOS (App Store)
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # App Store Connect credentials (API key approach)
          EXPO_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          eas build --platform ios --profile production --non-interactive --auto-submit

  # ── Android ───────────────────────────────────────────────────────────────
  android-build-submit:
    name: Android — Build & Submit to Google Play
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Write Google Play service account key
        env:
          GOOGLE_PLAY_KEY: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_KEY }}
        run: echo "$GOOGLE_PLAY_KEY" > mobile/google-play-service-account.json

      - name: Build & Submit Android (Google Play internal track)
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build --platform android --profile production --non-interactive --auto-submit

      - name: Clean up credentials
        if: always()
        run: rm -f mobile/google-play-service-account.json
