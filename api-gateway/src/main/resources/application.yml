server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://auth-service:8081
          predicates:
            - Path=/auth/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
                key-resolver: "#{@remoteAddrKeyResolver}"
        - id: f1-data-service
          uri: http://f1-data-service:8085
          predicates:
            - Path=/f1/**
        - id: prediction-service
          uri: http://prediction-service:8082
          predicates:
            - Path=/predictions/**
        - id: league-service
          uri: http://league-service:8083
          predicates:
            - Path=/leagues/**
        - id: scoring-service
          uri: http://scoring-service:8084
          predicates:
            - Path=/scores/**
        - id: notification-service
          uri: http://notification-service:8086
          predicates:
            - Path=/notifications/**
        - id: analytics-service
          uri: http://analytics-service:8087
          predicates:
            - Path=/analytics/**
        - id: f1-data-service-ws
          uri: ws://f1-data-service:8085
          predicates:
            - Path=/ws/**
        - id: web-app
          uri: http://web:80
          predicates:
            - Path=/app/**
          filters:
            - StripPrefix=1
        - id: web-static
          uri: http://web-static:80
          predicates:
            - Path=/**
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: 6379

jwt:
  secret: ${JWT_SECRET:change-me-in-production-use-256-bit-key}
