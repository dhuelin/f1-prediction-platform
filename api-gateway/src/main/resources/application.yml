server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "https://app.pitwall.guru"
              - "https://app.test.pitwall.guru"
              - "http://localhost:3000"
              - "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600
      routes:
        # auth, predictions, leagues, scores, notifications and analytics are all
        # served by pitwall-api since the six services were consolidated.
        - id: pitwall-api-auth
          uri: http://pitwall-api:8081
          predicates:
            - Path=/auth/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
                key-resolver: "#{@remoteAddrKeyResolver}"
        - id: f1-data-service
          uri: http://f1-data-service:8085
          predicates:
            - Path=/f1/**
        # Joining by invite code is the one place a code alone grants access to a
        # private league, so it gets its own limit. Declared BEFORE the general
        # pitwall-api route: Spring Cloud Gateway takes the first route whose
        # predicates match, so the broader Path=/leagues/** below would otherwise
        # swallow this one and the limit would never apply.
        #
        # Keyed on the authenticated user, not the IP — see RateLimiterConfig.
        # 1 token/s with 10 tokens per request and a 60-token bucket is six
        # attempts back-to-back, then one every ten seconds. A human correcting a
        # mistyped code never notices; an account is capped near 8,600 tries a day
        # against a 50-bit code space, which is about 3.5e7 years for even odds.
        - id: pitwall-api-league-join
          uri: http://pitwall-api:8081
          predicates:
            - Path=/leagues/join
            - Method=POST
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.requestedTokens: 10
                redis-rate-limiter.burstCapacity: 60
                key-resolver: "#{@userKeyResolver}"
        - id: pitwall-api
          uri: http://pitwall-api:8081
          predicates:
            - Path=/predictions/**,/leagues/**,/scores/**,/notifications/**,/analytics/**
        - id: f1-data-service-ws
          uri: ws://f1-data-service:8085
          predicates:
            - Path=/ws/**
        - id: web-app
          uri: http://web:80
          predicates:
            - Path=/app/**
          filters:
            - StripPrefix=1
        - id: web-static
          uri: http://web-static:80
          predicates:
            - Path=/**
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: 6379

jwt:
  secret: ${JWT_SECRET:change-me-in-production-use-256-bit-key}
