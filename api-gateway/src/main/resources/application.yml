server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "https://app.pitwall.guru"
              - "https://app.test.pitwall.guru"
              - "http://localhost:3000"
              - "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600
      routes:
        # auth, predictions, leagues, scores, notifications and analytics are all
        # served by pitwall-api since the six services were consolidated.
        - id: pitwall-api-auth
          uri: http://pitwall-api:8081
          predicates:
            - Path=/auth/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
                key-resolver: "#{@remoteAddrKeyResolver}"
        - id: f1-data-service
          uri: http://f1-data-service:8085
          predicates:
            - Path=/f1/**
        - id: pitwall-api
          uri: http://pitwall-api:8081
          predicates:
            - Path=/predictions/**,/leagues/**,/scores/**,/notifications/**,/analytics/**
        - id: f1-data-service-ws
          uri: ws://f1-data-service:8085
          predicates:
            - Path=/ws/**
        - id: web-app
          uri: http://web:80
          predicates:
            - Path=/app/**
          filters:
            - StripPrefix=1
        - id: web-static
          uri: http://web-static:80
          predicates:
            - Path=/**
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: 6379

jwt:
  secret: ${JWT_SECRET:change-me-in-production-use-256-bit-key}
