plugins {
    id 'java'
    alias(libs.plugins.spring.boot) apply false
    alias(libs.plugins.spring.dependency.management) apply false
}

allprojects {
    group = 'com.f1predict'
    version = '0.1.0-SNAPSHOT'
}

subprojects {
    apply plugin: 'java'
    java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
    repositories { mavenCentral() }
    test {
        useJUnitPlatform()
        testLogging {
            events 'failed'
            exceptionFormat 'full'
            // Testcontainers reports WHY it could not reach Docker through its
            // logger, not through the exception it throws -- the stack trace has
            // no cause chain at all. So when Docker discovery is what is in
            // question, the test JVM's output is the only place the answer
            // exists. Off by default because 63 tests of Spring Boot startup
            // logs would bury everything else.
            showStandardStreams = project.hasProperty('testOutput')
        }
    }
    dependencies {
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
}
