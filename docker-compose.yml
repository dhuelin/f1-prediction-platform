services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: f1predict
      POSTGRES_PASSWORD: f1predict
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U f1predict"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: f1predict
      RABBITMQ_DEFAULT_PASS: f1predict
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  pitwall-api:
    build:
      context: .
      dockerfile: pitwall-api/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pitwall_db
      SPRING_DATASOURCE_USERNAME: f1predict
      SPRING_DATASOURCE_PASSWORD: f1predict
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: f1predict
      SPRING_RABBITMQ_PASSWORD: f1predict
      JWT_SECRET: change-me-in-production-use-256-bit-key-minimum
      SERVICES_F1DATA_URL: http://f1-data-service:8085
      APNS_TEAM_ID: ""
      APNS_KEY_ID: ""
      APNS_BUNDLE_ID: com.f1predict.app
      APNS_AUTH_KEY: ""
      FIREBASE_CREDENTIALS_JSON: ""
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 5

  f1-data-service:
    build:
      context: .
      dockerfile: services/f1-data-service/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/f1data_db
      SPRING_DATASOURCE_USERNAME: f1predict
      SPRING_DATASOURCE_PASSWORD: f1predict
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: f1predict
      SPRING_RABBITMQ_PASSWORD: f1predict
      SPRING_DATA_REDIS_HOST: redis
      JWT_SECRET: change-me-in-production-use-256-bit-key-minimum
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    environment:
      JWT_SECRET: change-me-in-production-use-256-bit-key-minimum
      SPRING_DATA_REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy
      pitwall-api:
        condition: service_started
      f1-data-service:
        condition: service_started

  web:
    build: ./web
    environment:
      # VITE vars are baked in at build time by Vite — api-gateway is a Docker-internal
      # hostname the browser cannot resolve, so use the host-mapped port instead.
      - VITE_API_BASE_URL=http://localhost:8080
    depends_on:
      - api-gateway

volumes:
  postgres_data:
