plugins {
    alias(libs.plugins.spring.boot)
    alias(libs.plugins.spring.dependency.management)
}
// Spring Boot's dependency-management BOM pins testcontainers.version (3.3.0
// pins 1.19.8). Declaring a newer junit-jupiter and postgresql here is not
// enough on its own: the BOM pulls the core org.testcontainers:testcontainers
// artifact back down, leaving 1.21.4 modules on a 1.19.8 core. This is the
// documented override, and it moves the whole family together.
ext['testcontainers.version'] = libs.versions.testcontainers.get()


dependencies {
    implementation project(':common')
    implementation libs.spring.boot.actuator
    implementation libs.spring.boot.web
    implementation libs.spring.boot.websocket
    implementation libs.spring.boot.data.jpa
    implementation libs.spring.boot.amqp
    implementation libs.spring.boot.data.redis
    implementation libs.flyway
    implementation libs.flyway.postgres
    runtimeOnly libs.postgresql
    testImplementation libs.spring.boot.test
    testImplementation libs.testcontainers.junit
    testImplementation libs.testcontainers.postgresql
    testImplementation libs.wiremock
}
